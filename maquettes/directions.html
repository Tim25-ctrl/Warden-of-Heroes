<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Directions graphiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=Alegreya+SC:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #2a2622; font-family: 'Alegreya Sans', system-ui, sans-serif; color: #eee; }
  .label { max-width: 1240px; margin: 28px auto 10px; padding: 0 16px; font: 700 15px 'Alegreya Sans'; letter-spacing: .08em; text-transform: uppercase; color: #d9c9a8; }
  .label small { text-transform: none; letter-spacing: 0; font-weight: 400; color: #a99a7d; margin-left: 8px; }
  .frame { max-width: 1240px; margin: 0 auto 8px; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.4); }

  /* ---- Direction A : enluminure (parchemin, encre, or) ---- */
  .A { --bg:#efe3c6; --panel:#f8f0dc; --panel2:#f3e8cd; --ink:#2b1f14; --soft:#6b5640; --faint:#9a8467; --line:#c9b088; --accent:#9e2f22; --gold:#a8801f; --ok:#3f6e3a; --warn:#b2741a; --bad:#9e2f22;
        --wood:#7a5a3a; --wall:#e9dcbd; --floor:#c9a978; --title:'Cinzel', serif; --nav:#3b2b1c; --navInk:#efe3c6; }
  /* ---- Direction B : taverne (bois sombre, laiton, chandelle) ---- */
  .B { --bg:#1b1713; --panel:#26201a; --panel2:#2f281f; --ink:#f1e6cf; --soft:#cbb998; --faint:#8f7f66; --line:#4a3e30; --accent:#e0794f; --gold:#e3b14f; --ok:#9cc98a; --warn:#e8b45a; --bad:#e46e5a;
        --wood:#5b4128; --wall:#3a2f25; --floor:#4c3a28; --title:'Alegreya SC', serif; --nav:#120f0c; --navInk:#e3d3b2; }

  .app { display: grid; grid-template-columns: 200px 1fr; grid-template-rows: auto 1fr; background: var(--bg); color: var(--ink); min-height: 620px; }
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 2px solid var(--line); flex-wrap: wrap; }
  .brand { font: 700 20px var(--title); color: var(--accent); margin-right: 8px; }
  .pill { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
  .pill i { font-size: 20px; }
  .pill .v { font-weight: 700; font-size: 17px; }
  .pill .s { font-size: 13px; color: var(--soft); }
  .pill.money i { color: var(--gold); } .pill.seal i { color: var(--gold); } .pill.danger i { color: var(--ok); } .pill.pros i { color: var(--ok); }
  .delta { color: var(--ok); font-size: 13px; font-weight: 700; }
  .clock { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .clock .date { text-align: right; line-height: 1.1; } .clock .date b { font: 700 15px var(--title); } .clock .date span { font-size: 12px; color: var(--soft); }
  .speed { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .speed button { background: none; border: 0; color: var(--ink); padding: 6px 10px; font-size: 16px; } .speed .on { background: var(--accent); color: #fff; }

  nav { background: var(--nav); color: var(--navInk); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; font-size: 15px; color: var(--navInk); text-decoration: none; opacity: .85; }
  nav a i { font-size: 20px; width: 22px; text-align: center; }
  nav a.on { background: var(--accent); color: #fff; opacity: 1; }
  nav .badge { margin-left: auto; background: var(--gold); color: #1b1408; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 0 7px; }
  nav h6 { font: 700 11px 'Alegreya Sans'; letter-spacing: .12em; text-transform: uppercase; opacity: .5; margin: 12px 10px 4px; }

  main { padding: 16px 18px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .card h2 { font: 700 19px var(--title); margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
  .card h2 i { color: var(--accent); }
  .card .sub { color: var(--soft); font-size: 14px; margin: 0 0 12px; }
  .wide { grid-column: 1 / -1; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { background: var(--panel2); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); }
  .kpi .k { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--soft); }
  .kpi .k i { font-size: 17px; }
  .kpi .v { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .kpi .hint { font-size: 12.5px; color: var(--faint); }
  .kpi .help { margin-left: auto; color: var(--faint); }
  .bar { height: 8px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 6px; } .bar span { display: block; height: 100%; border-radius: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .tag.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .tag.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .tag.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .nm { font-weight: 700; } .row .ds { font-size: 13px; color: var(--soft); }
  .row .sp { flex: 1; }
  .price { display: flex; align-items: center; gap: 4px; } .price b { min-width: 86px; text-align: center; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
  .price button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--ink); }
  .feed .it { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .feed .it i { font-size: 20px; } .feed .it small { color: var(--faint); display: block; }
  .ico-q { color: var(--accent); } .ico-m { color: var(--gold); } .ico-a { color: var(--ok); } .ico-w { color: var(--warn); }
  .morning { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .morning .m { display: flex; gap: 10px; align-items: flex-start; background: var(--panel2); border-radius: 12px; padding: 10px; border: 1px solid var(--line); font-size: 14px; }
  .morning .m i { font-size: 22px; }
  svg text { font-family: 'Alegreya Sans', sans-serif; }
</style>
</head>
<body>

<div class="label">Direction A — Enluminure <small>parchemin, encre brune et or, titres gravés</small></div>
<div class="frame A"><div class="app" id="appA"></div></div>

<div class="label">Direction B — Taverne à la chandelle <small>bois sombre, laiton et lumière chaude</small></div>
<div class="frame B"><div class="app" id="appB"></div></div>

<template id="tpl">
  <header class="top">
    <span class="brand">Warden of Heroes</span>
    <span class="pill money" title="Trésorerie"><i class="ti ti-coins"></i><span class="v">600 po</span><span class="delta">+30 aujourd'hui</span></span>
    <span class="pill seal" title="Sceau de la guilde"><i class="ti ti-rosette"></i><span class="v">Argent</span><span class="s">1 039 pts</span></span>
    <span class="pill danger" title="Danger de la région"><i class="ti ti-shield-check"></i><span class="v">Calme</span><span class="s">danger 16</span></span>
    <span class="pill pros" title="Prospérité de la ville"><i class="ti ti-building-community"></i><span class="v">Ville</span><span class="s">prospérité 60</span></span>
    <span class="pill" title="Aventuriers"><i class="ti ti-users"></i><span class="v">36</span><span class="s">17 au siège · 19 en quête</span></span>
    <div class="clock"><div class="date"><b>Printemps, jour 9</b><br /><span>an 2 · 14 h · après-midi</span></div>
      <div class="speed"><button><i class="ti ti-player-pause"></i></button><button class="on"><i class="ti ti-player-play"></i></button><button>×2</button><button>×4</button><button>×8</button></div></div>
  </header>
  <nav>
    <h6>La guilde</h6>
    <a class="on"><i class="ti ti-building-castle"></i>Siège</a>
    <a><i class="ti ti-users"></i>Aventuriers<span class="badge">2</span></a>
    <a><i class="ti ti-chef-hat"></i>Personnel</a>
    <h6>Le monde</h6>
    <a><i class="ti ti-clipboard-list"></i>Tableau</a>
    <a><i class="ti ti-scale"></i>Comptoir</a>
    <a><i class="ti ti-map-2"></i>Carte</a>
    <a><i class="ti ti-news"></i>Chroniques</a>
    <h6>Les livres</h6>
    <a><i class="ti ti-certificate"></i>Charte</a>
    <a><i class="ti ti-book"></i>Livre de la guilde</a>
    <a><i class="ti ti-report-money"></i>Livre de comptes</a>
  </nav>
  <main>
    <section class="card wide">
      <h2><i class="ti ti-sunrise"></i>Ce matin à la guilde</h2>
      <p class="sub">Ce qui a changé depuis hier, et ce qui attend ta décision.</p>
      <div class="morning">
        <div class="m"><i class="ti ti-coins ico-m"></i><div><b>+30 po hier</b><br />surtout les nuitées (18 po)</div></div>
        <div class="m"><i class="ti ti-certificate ico-q"></i><div><b>2 épreuves à organiser</b><br />Aldric, Sibylle</div></div>
        <div class="m"><i class="ti ti-tools-kitchen-2 ico-w"></i><div><b>Rupture de céréales</b><br />monte la commande automatique</div></div>
        <div class="m"><i class="ti ti-leaf ico-a"></i><div><b>Chasse rouverte</b><br />aux loups de Vertbois</div></div>
      </div>
    </section>
    <section class="card wide">
      <h2><i class="ti ti-building-castle"></i>Le Siège</h2>
      <p class="sub">Clique sur une salle pour la gérer, ou sur un aventurier pour ouvrir sa fiche.</p>
      <svg viewBox="0 0 1000 380" width="100%" role="img" aria-label="Vue en coupe illustrée du siège">
        <rect x="0" y="0" width="1000" height="380" fill="var(--panel2)" rx="10"/>
        <path d="M40 92 L500 18 L960 92 Z" fill="var(--accent)" opacity=".85"/>
        <path d="M40 92 L500 18 L960 92" fill="none" stroke="var(--wood)" stroke-width="6"/>
        <text x="500" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" style="font-family:var(--title)">Siège de la guilde</text>
        <rect x="40" y="92" width="920" height="270" fill="var(--wall)" stroke="var(--wood)" stroke-width="6"/>
        <line x1="40" y1="222" x2="960" y2="222" stroke="var(--wood)" stroke-width="8"/>
        <line x1="420" y1="92" x2="420" y2="222" stroke="var(--wood)" stroke-width="6"/>
        <line x1="680" y1="92" x2="680" y2="222" stroke="var(--wood)" stroke-width="6"/>
        <line x1="260" y1="222" x2="260" y2="362" stroke="var(--wood)" stroke-width="6"/>
        <line x1="700" y1="222" x2="700" y2="362" stroke="var(--wood)" stroke-width="6"/>
        <rect x="44" y="204" width="372" height="14" fill="var(--floor)"/><rect x="424" y="204" width="252" height="14" fill="var(--floor)"/><rect x="684" y="204" width="272" height="14" fill="var(--floor)"/>
        <rect x="44" y="344" width="912" height="14" fill="var(--floor)"/>
        <g><rect x="52" y="100" width="150" height="26" rx="13" fill="var(--panel)" stroke="var(--line)"/><text x="66" y="118" font-size="15" font-weight="700" fill="var(--ink)">Dortoirs</text><text x="194" y="118" font-size="13" text-anchor="end" fill="var(--soft)">32/60 lits</text></g>
        <g fill="var(--accent)" opacity=".75">
          <rect x="60" y="172" width="44" height="22" rx="4"/><rect x="114" y="172" width="44" height="22" rx="4"/><rect x="168" y="172" width="44" height="22" rx="4"/><rect x="222" y="172" width="44" height="22" rx="4"/><rect x="276" y="172" width="44" height="22" rx="4"/><rect x="330" y="172" width="44" height="22" rx="4"/>
        </g>
        <g fill="var(--wall)"><rect x="60" y="172" width="12" height="22" rx="3"/><rect x="114" y="172" width="12" height="22" rx="3"/><rect x="168" y="172" width="12" height="22" rx="3"/><rect x="222" y="172" width="12" height="22" rx="3"/><rect x="276" y="172" width="12" height="22" rx="3"/><rect x="330" y="172" width="12" height="22" rx="3"/></g>
        <g transform="translate(140 158)"><circle r="9" fill="#9e2f22"/><circle cy="-13" r="6" fill="#f0d2b0"/><text x="14" y="-14" font-size="15">z</text></g>
        <g transform="translate(250 158)"><circle r="9" fill="#2f5470"/><circle cy="-13" r="6" fill="#f0d2b0"/><text x="14" y="-14" font-size="15">z</text></g>
        <g><rect x="432" y="100" width="160" height="26" rx="13" fill="var(--panel)" stroke="var(--line)"/><text x="446" y="118" font-size="15" font-weight="700" fill="var(--ink)">Infirmerie</text><text x="584" y="118" font-size="13" text-anchor="end" fill="var(--soft)">2/10</text></g>
        <g><rect x="446" y="172" width="54" height="22" rx="4" fill="#e8e1d2" stroke="var(--line)"/><rect x="514" y="172" width="54" height="22" rx="4" fill="#e8e1d2" stroke="var(--line)"/><rect x="582" y="172" width="54" height="22" rx="4" fill="#e8e1d2" stroke="var(--line)"/>
          <path d="M650 150 h8 v-8 h8 v8 h8 v8 h-8 v8 h-8 v-8 h-8 z" fill="var(--bad)"/></g>
        <g transform="translate(476 162)"><circle r="9" fill="#3f6e3a"/><circle cy="-13" r="6" fill="#f0d2b0"/></g>
        <g><rect x="692" y="100" width="150" height="26" rx="13" fill="var(--panel)" stroke="var(--line)"/><text x="706" y="118" font-size="15" font-weight="700" fill="var(--ink)">Terrain</text><text x="834" y="118" font-size="13" text-anchor="end" fill="var(--soft)">2 profs</text></g>
        <g stroke="var(--wood)" stroke-width="5"><line x1="740" y1="200" x2="740" y2="160"/><line x1="725" y1="172" x2="755" y2="172"/><line x1="900" y1="200" x2="900" y2="160"/><line x1="885" y1="172" x2="915" y2="172"/></g>
        <g transform="translate(800 186)"><circle r="9" fill="#b07a1f"/><circle cy="-13" r="6" fill="#f0d2b0"/><text x="12" y="-12" font-size="15" fill="var(--ink)">⚔</text></g>
        <g><rect x="52" y="230" width="150" height="26" rx="13" fill="var(--panel)" stroke="var(--line)"/><text x="66" y="248" font-size="15" font-weight="700" fill="var(--ink)">Comptoir</text></g>
        <rect x="70" y="300" width="160" height="40" rx="4" fill="var(--wood)"/><rect x="70" y="296" width="160" height="8" fill="var(--floor)"/>
        <g transform="translate(150 286)"><circle r="8" fill="var(--gold)"/><circle cy="-12" r="6" fill="#f0d2b0"/></g>
        <g><rect x="272" y="230" width="170" height="26" rx="13" fill="var(--panel)" stroke="var(--line)"/><text x="286" y="248" font-size="15" font-weight="700" fill="var(--ink)">Réfectoire</text><text x="434" y="248" font-size="13" text-anchor="end" fill="var(--soft)">14/24</text></g>
        <g fill="var(--wood)"><rect x="290" y="306" width="170" height="14" rx="3"/><rect x="490" y="306" width="170" height="14" rx="3"/></g>
        <g transform="translate(320 296)"><circle r="9" fill="#9e2f22"/><circle cy="-13" r="6" fill="#f0d2b0"/></g>
        <g transform="translate(360 296)"><circle r="9" fill="#5b5b7a"/><circle cy="-13" r="6" fill="#f0d2b0"/></g>
        <g transform="translate(540 296)"><circle r="9" fill="#3f6e3a"/><circle cy="-13" r="6" fill="#f0d2b0"/></g>
        <g><rect x="712" y="230" width="150" height="26" rx="13" fill="var(--panel)" stroke="var(--line)"/><text x="726" y="248" font-size="15" font-weight="700" fill="var(--ink)">Cuisine</text><text x="854" y="248" font-size="13" text-anchor="end" fill="var(--soft)">31/h</text></g>
        <path d="M760 340 v-50 h80 v50" fill="none" stroke="var(--wood)" stroke-width="6"/>
        <path d="M790 336 q10 -26 20 0 q-10 -12 -20 0" fill="var(--warn)"/>
        <g transform="translate(900 300)"><circle r="9" fill="var(--ink)"/><circle cy="-13" r="6" fill="#f0d2b0"/></g>
      </svg>
    </section>
    <section class="card">
      <h2><i class="ti ti-bed"></i>Dortoirs <span class="tag ok">niveau 4</span></h2>
      <p class="sub">Où dorment tes aventuriers. Plus c'est confortable, plus ils récupèrent et paient volontiers.</p>
      <div class="kpis">
        <div class="kpi"><div class="k"><i class="ti ti-sparkles"></i>Confort<i class="ti ti-help-circle help"></i></div><div class="v">87</div><div class="bar"><span style="width:87%;background:var(--ok)"></span></div><div class="hint">très bon : ils restent</div></div>
        <div class="kpi"><div class="k"><i class="ti ti-moon"></i>Nuitées hier</div><div class="v">29</div><div class="hint">sur 32 présents</div></div>
        <div class="kpi"><div class="k"><i class="ti ti-coins"></i>Recette d'hier</div><div class="v">18 po</div><div class="hint">+2 po sur la veille</div></div>
        <div class="kpi"><div class="k"><i class="ti ti-door-exit"></i>Partis dormir ailleurs</div><div class="v">3</div><div class="hint"><span class="tag warn">trop cher</span></div></div>
      </div>
      <div style="margin-top:12px">
        <div class="row"><i class="ti ti-bed"></i><div><div class="nm">Dortoir commun</div><div class="ds">En ville : 4 pa 6 pc</div></div><span class="sp"></span><div class="price"><button>−</button><b>8 pa 6 pc</b><button>+</button></div><span class="tag ok">correct</span></div>
        <div class="row"><i class="ti ti-bed"></i><div><div class="nm">Chambre individuelle</div><div class="ds">En ville : 4 pa 6 pc</div></div><span class="sp"></span><div class="price"><button>−</button><b>2 po 1 pa</b><button>+</button></div><span class="tag warn">cher</span></div>
      </div>
    </section>
    <section class="card feed">
      <h2><i class="ti ti-notebook"></i>Journal</h2>
      <p class="sub">Les faits marquants, par catégorie.</p>
      <div class="it"><i class="ti ti-swords ico-q"></i><div>L'équipe de <b>Pétronille</b> revient de « Chasser 1 araignée géante » avec succès.<small>J121 · 10 h · récompense 31 po</small></div></div>
      <div class="it"><i class="ti ti-certificate ico-m"></i><div><b>Aldric</b> réussit l'épreuve et reçoit l'insigne de rang C.<small>J121 · 09 h</small></div></div>
      <div class="it"><i class="ti ti-alert-triangle ico-w"></i><div>Fraude détectée : <b>Pétronille</b> écope d'une amende de 1 pa 5 pc.<small>J121 · 08 h</small></div></div>
      <div class="it"><i class="ti ti-leaf ico-a"></i><div>La chasse aux loups rouvre à Vertbois.<small>J121 · 00 h</small></div></div>
    </section>
  </main>
</template>
<script>
  for (const id of ['appA', 'appB']) document.getElementById(id).appendChild(document.getElementById('tpl').content.cloneNode(true));
</script>
</body>
</html>
